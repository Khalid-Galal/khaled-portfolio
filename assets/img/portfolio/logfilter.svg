<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="640" height="400">
  <defs>
    <linearGradient id="lgBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#121724"/>
      <stop offset="1" stop-color="#0a0d14"/>
    </linearGradient>
    <radialGradient id="lgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#3ecf8e" stop-opacity=".24"/>
      <stop offset="1" stop-color="#3ecf8e" stop-opacity="0"/>
    </radialGradient>
    <pattern id="lgGrid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0v32" fill="none" stroke="#161c28" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="640" height="400" fill="url(#lgBg)"/>
  <rect width="640" height="400" fill="url(#lgGrid)"/>
  <ellipse cx="320" cy="200" rx="280" ry="180" fill="url(#lgGlow)"/>

  <!-- blocked lines -->
  <g fill="none" stroke="#2a3345" stroke-width="2" stroke-dasharray="4 5">
    <path d="M220 125h32M220 180h76M220 225h32M220 275h120"/>
  </g>
  <!-- lines that survive every layer -->
  <g fill="none" stroke="#3ecf8e" stroke-width="2.5">
    <path d="M220 155h176M220 200h176M220 245h176"/>
  </g>

  <!-- raw bank logs -->
  <rect x="36" y="76" width="184" height="248" rx="12" fill="#151b28" stroke="#2a3345" stroke-width="2"/>
  <g fill="#212836">
    <rect x="54" y="100" width="140" height="7" rx="3"/>
    <rect x="54" y="120" width="110" height="7" rx="3"/>
    <rect x="54" y="160" width="96" height="7" rx="3"/>
    <rect x="54" y="180" width="144" height="7" rx="3"/>
    <rect x="54" y="220" width="138" height="7" rx="3"/>
    <rect x="54" y="240" width="104" height="7" rx="3"/>
    <rect x="54" y="260" width="128" height="7" rx="3"/>
    <rect x="54" y="300" width="136" height="7" rx="3"/>
  </g>
  <g fill="#3ecf8e" fill-opacity=".5">
    <rect x="54" y="140" width="132" height="7" rx="3"/>
    <rect x="54" y="200" width="120" height="7" rx="3"/>
    <rect x="54" y="280" width="112" height="7" rx="3"/>
  </g>

  <!-- three filter layers -->
  <g fill="#151b28" stroke="#3ecf8e" stroke-width="2.5">
    <rect x="246" y="110" width="14" height="180" rx="7"/>
    <rect x="290" y="110" width="14" height="180" rx="7"/>
    <rect x="334" y="110" width="14" height="180" rx="7"/>
  </g>

  <!-- isolated entries -->
  <rect x="404" y="120" width="192" height="160" rx="12" fill="#151b28" stroke="#3ecf8e" stroke-width="2.5"/>
  <g fill="#3ecf8e">
    <circle cx="428" cy="155" r="5"/>
    <circle cx="428" cy="200" r="5"/>
    <circle cx="428" cy="245" r="5"/>
  </g>
  <g fill="#39435a">
    <rect x="444" y="150" width="126" height="9" rx="4"/>
    <rect x="444" y="195" width="104" height="9" rx="4"/>
    <rect x="444" y="240" width="118" height="9" rx="4"/>
  </g>
</svg>
