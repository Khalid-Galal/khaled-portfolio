<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="640" height="400">
  <defs>
    <linearGradient id="ocrBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#121724"/>
      <stop offset="1" stop-color="#0a0d14"/>
    </linearGradient>
    <radialGradient id="ocrGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#f5a524" stop-opacity=".24"/>
      <stop offset="1" stop-color="#f5a524" stop-opacity="0"/>
    </radialGradient>
    <pattern id="ocrGrid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0v32" fill="none" stroke="#161c28" stroke-width="1"/>
    </pattern>
    <linearGradient id="ocrBeam" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f5a524" stop-opacity="0"/>
      <stop offset=".5" stop-color="#f5a524" stop-opacity=".3"/>
      <stop offset="1" stop-color="#f5a524" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="640" height="400" fill="url(#ocrBg)"/>
  <rect width="640" height="400" fill="url(#ocrGrid)"/>
  <ellipse cx="230" cy="200" rx="250" ry="180" fill="url(#ocrGlow)"/>

  <!-- connectors -->
  <g fill="none" stroke="#2a3345" stroke-width="2" stroke-dasharray="3 7">
    <path d="M254 158h76v-50"/>
    <path d="M254 210h76v-10"/>
    <path d="M254 288h76v4"/>
  </g>

  <!-- invoice document -->
  <rect x="56" y="58" width="214" height="284" rx="12" fill="#151b28" stroke="#2a3345" stroke-width="2"/>
  <rect x="82" y="88" width="110" height="14" rx="4" fill="#3a465c"/>
  <g fill="#232b3a">
    <rect x="82" y="126" width="162" height="11" rx="4"/>
    <rect x="82" y="152" width="138" height="11" rx="4"/>
    <rect x="82" y="178" width="158" height="11" rx="4"/>
    <rect x="82" y="204" width="124" height="11" rx="4"/>
    <rect x="82" y="230" width="166" height="11" rx="4"/>
    <rect x="82" y="256" width="132" height="11" rx="4"/>
    <rect x="82" y="282" width="110" height="11" rx="4"/>
  </g>

  <!-- detected regions -->
  <g fill="none" stroke="#f5a524" stroke-width="2" stroke-dasharray="7 6">
    <rect x="74" y="145" width="180" height="26" rx="6"/>
    <rect x="74" y="197" width="180" height="26" rx="6"/>
    <rect x="74" y="275" width="180" height="26" rx="6"/>
  </g>

  <!-- scan beam -->
  <rect x="56" y="196" width="214" height="40" fill="url(#ocrBeam)"/>
  <rect x="56" y="214" width="214" height="3" fill="#f5a524"/>

  <!-- extracted fields -->
  <g>
    <rect x="330" y="70" width="250" height="76" rx="12" fill="#151b28" stroke="#2a3345" stroke-width="2"/>
    <rect x="352" y="92" width="32" height="32" rx="8" fill="#f5a524" fill-opacity=".16" stroke="#f5a524" stroke-opacity=".55" stroke-width="2"/>
    <rect x="359" y="101" width="18" height="4" rx="2" fill="#f5a524"/>
    <rect x="359" y="111" width="12" height="4" rx="2" fill="#f5a524" fill-opacity=".6"/>
    <rect x="400" y="94" width="86" height="10" rx="5" fill="#39435a"/>
    <rect x="400" y="116" width="140" height="13" rx="6" fill="#4c5a72"/>
  </g>
  <g>
    <rect x="330" y="162" width="250" height="76" rx="12" fill="#151b28" stroke="#2a3345" stroke-width="2"/>
    <rect x="352" y="184" width="32" height="32" rx="8" fill="#f5a524" fill-opacity=".16" stroke="#f5a524" stroke-opacity=".55" stroke-width="2"/>
    <rect x="359" y="193" width="18" height="4" rx="2" fill="#f5a524"/>
    <rect x="359" y="203" width="12" height="4" rx="2" fill="#f5a524" fill-opacity=".6"/>
    <rect x="400" y="186" width="70" height="10" rx="5" fill="#39435a"/>
    <rect x="400" y="208" width="112" height="13" rx="6" fill="#4c5a72"/>
  </g>
  <g>
    <rect x="330" y="254" width="250" height="76" rx="12" fill="#151b28" stroke="#2a3345" stroke-width="2"/>
    <rect x="352" y="276" width="32" height="32" rx="8" fill="#f5a524" fill-opacity=".16" stroke="#f5a524" stroke-opacity=".55" stroke-width="2"/>
    <rect x="359" y="285" width="18" height="4" rx="2" fill="#f5a524"/>
    <rect x="359" y="295" width="12" height="4" rx="2" fill="#f5a524" fill-opacity=".6"/>
    <rect x="400" y="278" width="94" height="10" rx="5" fill="#39435a"/>
    <rect x="400" y="300" width="126" height="13" rx="6" fill="#4c5a72"/>
  </g>
</svg>
