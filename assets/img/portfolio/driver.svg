  <ellipse cx="300" cy="200" rx="280" ry="180" fill="url(#dvGlow)"/>

  <!-- camera feed -->
  <rect x="36" y="86" width="272" height="212" rx="12" fill="#151b28" stroke="#2a3345" stroke-width="2"/>
  <g clip-path="url(#dvClip)" fill="#263041">
