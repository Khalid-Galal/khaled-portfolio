<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="640" height="400">
  <defs>
    <linearGradient id="dvBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#121724"/>
      <stop offset="1" stop-color="#0a0d14"/>
    </linearGradient>
    <radialGradient id="dvGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#22d3ee" stop-opacity=".24"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dvGrid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0v32" fill="none" stroke="#161c28" stroke-width="1"/>
    </pattern>
    <clipPath id="dvClip"><rect x="36" y="86" width="272" height="212" rx="12"/></clipPath>
  </defs>

  <rect width="640" height="400" fill="url(#dvBg)"/>
