<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="640" height="400">
  <defs>
    <linearGradient id="blBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#121724"/>
      <stop offset="1" stop-color="#0a0d14"/>
    </linearGradient>
    <radialGradient id="blGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#f472b6" stop-opacity=".24"/>
      <stop offset="1" stop-color="#f472b6" stop-opacity="0"/>
    </radialGradient>
    <pattern id="blGrid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0v32" fill="none" stroke="#161c28" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="640" height="400" fill="url(#blBg)"/>
  <rect width="640" height="400" fill="url(#blGrid)"/>
  <ellipse cx="320" cy="200" rx="280" ry="180" fill="url(#blGlow)"/>

  <!-- english, left to right -->
  <rect x="52" y="88" width="234" height="224" rx="14" fill="#151b28" stroke="#2a3345" stroke-width="2"/>
  <text x="76" y="130" font-family="Segoe UI, system-ui, sans-serif" font-size="22" font-weight="700" fill="#f472b6">EN</text>
  <g fill="#232b3a">
    <rect x="76" y="156" width="170" height="10" rx="5"/>
    <rect x="76" y="180" width="140" height="10" rx="5"/>
    <rect x="76" y="204" width="162" height="10" rx="5"/>
    <rect x="76" y="228" width="120" height="10" rx="5"/>
    <rect x="76" y="252" width="154" height="10" rx="5"/>
    <rect x="76" y="276" width="98" height="10" rx="5"/>
  </g>

  <!-- swap -->
  <g fill="none" stroke="#f472b6" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <path d="M298 188h36M326 180l9 8-9 8M342 216h-36M314 208l-9 8 9 8"/>
  </g>

  <!-- arabic, right to left -->
  <rect x="354" y="88" width="234" height="224" rx="14" fill="#151b28" stroke="#f472b6" stroke-width="2.5"/>
  <text x="564" y="130" text-anchor="end" font-family="Segoe UI, system-ui, sans-serif" font-size="22" font-weight="700" fill="#f472b6">AR</text>
  <g fill="#232b3a">
    <rect x="394" y="156" width="170" height="10" rx="5"/>
    <rect x="424" y="180" width="140" height="10" rx="5"/>
    <rect x="402" y="204" width="162" height="10" rx="5"/>
    <rect x="444" y="228" width="120" height="10" rx="5"/>
    <rect x="410" y="252" width="154" height="10" rx="5"/>
    <rect x="466" y="276" width="98" height="10" rx="5"/>
  </g>
</svg>
