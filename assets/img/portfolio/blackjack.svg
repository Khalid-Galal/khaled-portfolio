<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="640" height="400">
  <defs>
    <linearGradient id="bjBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#121724"/>
      <stop offset="1" stop-color="#0a0d14"/>
    </linearGradient>
    <radialGradient id="bjGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#f472b6" stop-opacity=".26"/>
      <stop offset="1" stop-color="#f472b6" stop-opacity="0"/>
    </radialGradient>
    <pattern id="bjGrid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0v32" fill="none" stroke="#161c28" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="640" height="400" fill="url(#bjBg)"/>
  <rect width="640" height="400" fill="url(#bjGrid)"/>
  <ellipse cx="300" cy="206" rx="270" ry="180" fill="url(#bjGlow)"/>

  <!-- ace of spades -->
  <g transform="rotate(-11 245 209)">
    <rect x="170" y="104" width="150" height="210" rx="16" fill="#eef1f6" stroke="#c8d1e0" stroke-width="2"/>
    <text x="192" y="152" font-family="Segoe UI, system-ui, sans-serif" font-size="42" font-weight="700" fill="#161b26">A</text>
    <g transform="translate(214 178) scale(2.6)">
      <path d="M12 2.5C12 2.5 4 8.5 4 13.5c0 2.7 2.1 4.3 4.2 4.3 1.3 0 2.4-.6 3-1.5-.1 2.1-1 3.9-2.4 5.2h6.4c-1.4-1.3-2.3-3.1-2.4-5.2.6.9 1.7 1.5 3 1.5 2.1 0 4.2-1.6 4.2-4.3 0-5-8-11-8-11z" fill="#161b26"/>
    </g>
  </g>

  <!-- ten of hearts -->
  <g transform="rotate(11 345 209)">
    <rect x="270" y="104" width="150" height="210" rx="16" fill="#eef1f6" stroke="#c8d1e0" stroke-width="2"/>
    <text x="292" y="152" font-family="Segoe UI, system-ui, sans-serif" font-size="40" font-weight="700" fill="#d64a72">10</text>
    <g transform="translate(314 178) scale(2.6)">
      <path d="M12 21.3C5.5 16.6 2.5 13.3 2.5 9.7 2.5 6.9 4.8 4.7 7.6 4.7c1.8 0 3.4.9 4.4 2.4 1-1.5 2.6-2.4 4.4-2.4 2.8 0 5.1 2.2 5.1 5 0 3.6-3 6.9-9.5 11.6z" fill="#d64a72"/>
    </g>
  </g>

  <!-- 21 -->
  <rect x="462" y="86" width="110" height="72" rx="18" fill="#151b28" stroke="#f472b6" stroke-opacity=".5" stroke-width="2"/>
  <text x="517" y="139" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="44" font-weight="700" fill="#f472b6">21</text>

  <!-- chip -->
  <circle cx="512" cy="268" r="46" fill="#151b28" stroke="#f472b6" stroke-width="3"/>
  <circle cx="512" cy="268" r="30" fill="none" stroke="#f472b6" stroke-opacity=".45" stroke-width="2" stroke-dasharray="10 8"/>
  <circle cx="512" cy="268" r="9" fill="#f472b6" fill-opacity=".8"/>
</svg>
